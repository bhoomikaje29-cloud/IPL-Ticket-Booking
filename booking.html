<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
</head>

<body>

    <h1>IPL Ticket Booking</h1>
    <p>Fill in the details below to book your tickets.</p>
    <form>

<label for="name">Full Name:</label>
<input type="text" id="name" name="name"
       placeholder="Enter your full name"
       required minlength="3" maxlength="30">
<br><br>
<label for="email">Email:</label>
<input type="email" id="email" name="email"
       placeholder="Enter your email"
       required>
<br><br>
<label for="phone">Phone Number:</label>
<input type="tel" id="phone" name="phone"
       placeholder="Enter your phone number"
       required minlength="10" maxlength="10" pattern="[0-9]{10}">
<br><br>
<label for="match">Select Match:</label>
<select id="match" name="match" required>
    <option value="">-- Select a Match --</option>
    <option value="CSK vs RCB">CSK vs RCB</option>
    <option value="MI vs KKR">MI vs KKR</option>
    <option value="SRH vs RR">SRH vs RR</option>
</select>
<br><br>
<label for="stand">Stand Category:</label>
<select id="stand" name="stand" required>
    <option value="">-- Select Stand --</option>
    <option value="General">General</option>
    <option value="Premium">Premium</option>
    <option value="VIP">VIP</option>
</select>
<br><br>
<label for="tickets">Number of Tickets:</label>
<input type="number" id="tickets" name="tickets"
       min="1" max="10" required>
<br><br>
     <label>Seating Preference:</label><br>

<input type="radio" id="aisle" name="seating" value="Aisle" required>
<label for="aisle">Aisle Seat</label>

<input type="radio" id="middle" name="seating" value="Middle">
<label for="middle">Middle Seat</label>

<input type="radio" id="window" name="seating" value="Window">
<label for="window">Window Seat</label>

<br><br>
<input type="submit" value="Book Ticket">
<input type="reset" value="Clear Form">
</form>

</body>
</html>
